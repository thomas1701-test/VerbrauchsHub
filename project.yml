name: VerbrauchsHub
options:
  bundleIdPrefix: net.gmx.dillmann
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: de
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_CFBundleDisplayName: VerbrauchsHub
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    SWIFT_STRICT_CONCURRENCY: complete
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "1.1.0"
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
    DEVELOPMENT_TEAM: RVXL7PUD42
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: "4"
targets:
  VerbrauchsHub:
    type: application
    platform: iOS
    sources:
      - path: VerbrauchsHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gmx.dillmann.VerbrauchsHub
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Foto vom Zählerstand als Beweis hinzufügen."
        INFOPLIST_KEY_NSCameraUsageDescription: "Foto vom Zählerstand direkt aufnehmen."
  VerbrauchsHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: VerbrauchsHubTests
      - path: StoreKit/VerbrauchsHub.storekit
        buildPhase: resources
    dependencies:
      - target: VerbrauchsHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gmx.dillmann.VerbrauchsHubTests
        GENERATE_INFOPLIST_FILE: YES
  VerbrauchsHubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: VerbrauchsHubUITests
    dependencies:
      - target: VerbrauchsHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.gmx.dillmann.VerbrauchsHubUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: VerbrauchsHub
schemes:
  VerbrauchsHub:
    build:
      targets:
        VerbrauchsHub: all
        VerbrauchsHubTests: [test]
        VerbrauchsHubUITests: [test]
    run:
      config: Debug
      storeKitConfiguration: StoreKit/VerbrauchsHub.storekit
    test:
      config: Debug
      targets:
        - VerbrauchsHubTests
        - VerbrauchsHubUITests
    archive:
      config: Release
